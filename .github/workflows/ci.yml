name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.1"
      - run: npm ci --prefix agent --ignore-scripts --no-audit --no-fund
      - name: Prepare pinned isolated test runtime
        run: docker pull node:24.13.1@sha256:00e9195ebd49985a6da8921f419978d85dfe354589755192dc090425ce4da2f7
      - run: npm --prefix agent test
        env:
          RUN_DOCKER_CHECKS: "1"
      - run: npm --prefix agent run typecheck
      - run: npm --prefix agent run build
      - run: node agent/dist/scripts/ci.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-unit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-evidence/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
